id: prompt_0
name: matched_open_qa_prompt
system: |
  You are taking part in a reading-comprehension study.
user_template: |
  Please read the following story carefully.

  --- STORY ---
  {story}
  --- END STORY ---

  Question:
  {question}

  Answer the question in 1–2 sentences using only the information in the story.
  If the answer cannot be determined from the story, state that clearly.
  Do not explain your reasoning process.
